[project]
name = "dnssync"
version = "0.1.0"
description = "Parse BIND zone files and sync DNS records via RFC 2136 dynamic updates"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "meloam"},
]
dependencies = [
    "dnspython>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
]

[project.scripts]
dnssync = "dnssync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]